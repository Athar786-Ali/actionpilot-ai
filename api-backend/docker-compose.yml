version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: actionpilot
    ports:
      - "5433:5432"   # Yahan change kiya hai
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"